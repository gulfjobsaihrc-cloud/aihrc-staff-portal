
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIHRC Staff Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;color:#26352c;font-family:Arial,sans-serif}
header{background:#124b35;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
header h2{font-size:19px;margin:0}
main{max-width:1250px;margin:22px auto;padding:0 14px}
.card{background:white;border:1px solid #dce5df;border-radius:12px;padding:20px;margin-bottom:18px}
#loginBox{max-width:450px;margin:8vh auto}
h2,h3{color:#124b35}
label{display:block;margin-top:8px}
input,select,textarea{width:100%;padding:11px;border:1px solid #cbd7ce;border-radius:6px;margin:6px 0 12px;font-size:14px}
textarea{min-height:75px}
button{background:#176844;color:white;border:0;padding:10px 15px;border-radius:6px;cursor:pointer;margin:3px;font-weight:bold}
button:hover{background:#124b35}
button:disabled{opacity:.55;cursor:not-allowed}
.secondary{background:#64756b}
.danger{background:#b83232}
.light{background:#e7f0e9;color:#124b35}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:180px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px;border-bottom:1px solid #e3e9e5;text-align:left;font-size:13px}
th{background:#edf4ef;color:#124b35}
.hidden{display:none!important}
.small{font-size:12px;color:#68786d}
.message{padding:11px;border-radius:6px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ok{background:#e4f4e9;color:#145c31}
.err{background:#ffebeb;color:#9b2020}
.warn{background:#fff4dc;color:#805600}
.docrow{padding:10px;border-bottom:1px solid #e5eae6;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:750px){.grid{grid-template-columns:1fr}main{margin:12px auto}.card{padding:14px}}
</style>
</head>
<body>

<header>
  <h2>AMAN INTERNATIONAL HR CONSULTANT</h2>
  <div>
    <span id="userLabel"></span>
    <button id="logoutBtn" class="secondary hidden" onclick="logout()">Logout</button>
  </div>
</header>

<main>
  <div id="loginBox" class="card">
    <h2>Staff Portal Login</h2>
    <p class="small">AIHRC Candidate Management System</p>
    <label>Email</label>
    <input type="email" id="loginEmail" placeholder="Enter email">
    <label>Password</label>
    <input type="password" id="loginPassword" placeholder="Enter password">
    <button id="loginBtn" style="width:100%" onclick="login()">Login</button>
    <div id="loginMessage"></div>
  </div>

  <div id="app" class="hidden">
    <div id="message" class="message hidden"></div>

    <div class="card">
      <div class="toolbar">
        <h2 style="margin:0">Candidate Tracker</h2>
        <span style="flex:1"></span>
        <button onclick="newCandidate()">+ Add Candidate</button>
        <button class="secondary" onclick="loadCandidates()">Refresh</button>
      </div>
      <input id="searchBox" placeholder="Search candidates..." oninput="renderCandidates()">
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Candidate ID</th><th>Name</th><th>Mobile</th>
              <th>Position</th><th>Country</th><th>Status</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="candidateRows">
            <tr><td colspan="7">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card hidden" id="candidateFormCard">
      <h2 id="formHeading">Add Candidate</h2>
      <form id="candidateForm" onsubmit="saveCandidate(event)">
        <input type="hidden" id="candidate_id">
        <div class="grid">
          <div><label>Name *</label><input id="name" required></div>
          <div><label>Mobile</label><input id="mobile"></div>
          <div><label>Email</label><input id="email" type="email"></div>
          <div><label>Passport Number</label><input id="passport_number"></div>
          <div><label>Passport Expiry</label><input id="passport_expiry" type="date"></div>
          <div><label>Date of Birth</label><input id="dob" type="date"></div>
          <div><label>Country</label><input id="country"></div>
          <div><label>Position</label><input id="position"></div>
          <div><label>Indian Experience</label><input id="indian_experience"></div>
          <div><label>Overseas Experience</label><input id="overseas_experience"></div>
          <div><label>Staff</label><input id="staff"></div>
          <div><label>Location</label><input id="location"></div>
          <div>
            <label>Status</label>
            <select id="status">
              <option value="New">New</option>
              <option value="SHORTLISTED">SHORTLISTED</option>
              <option value="SELECTED">SELECTED</option>
              <option value="MEDICAL">MEDICAL</option>
              <option value="VISA PROCESSING">VISA PROCESSING</option>
              <option value="VISA APPROVED">VISA APPROVED</option>
              <option value="TICKET PENDING">TICKET PENDING</option>
              <option value="TICKET ISSUED">TICKET ISSUED</option>
              <option value="REJECTED">REJECTED</option>
              <option value="DEPLOYED">DEPLOYED</option>
            </select>
          </div>
          <div><label>Registration Type</label><input id="registration_type"></div>
        </div>
        <label>Remarks</label>
        <textarea id="remarks"></textarea>
        <button type="submit" id="saveCandidateBtn">Save Candidate</button>
        <button type="button" class="secondary" onclick="closeCandidateForm()">Cancel</button>
      </form>
    </div>

    <div class="card hidden" id="documentsCard">
      <div class="toolbar">
        <h2 style="margin:0">Candidate Documents</h2>
        <span style="flex:1"></span>
        <button class="secondary" onclick="closeDocuments()">Close</button>
      </div>
      <p id="selectedCandidateLabel"></p>
      <input type="hidden" id="selectedCandidateId">
      <label>Select CV / Passport / Certificate / Other Document</label>
      <input type="file" id="documentFile">
      <button type="button" id="uploadBtn" onclick="uploadDocument()">Upload Document</button>
      <p class="small">Maximum file size: 50 MB.</p>
      <h3>Uploaded Documents</h3>
      <div id="documentList">Loading...</div>
    </div>
  </div>
</main>

<script>
"use strict";

const SUPABASE_URL = "https://nffnrdvzjkxvokmitlev.supabase.co";
const SUPABASE_KEY = "sb_publishable_AoHpTGGE7e1Wkd4iYGaYHg_C1is5lYI";
const BUCKET = "aihrc-candidate-documents";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

let candidates=[];
let selectedCandidate=null;

const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function showMessage(message,type="ok"){
  $("message").textContent=message;
  $("message").className="message "+type;
  $("message").classList.remove("hidden");
}

function hideMessage(){
  $("message").classList.add("hidden");
}

function showLoginMessage(message,type="err"){
  $("loginMessage").textContent=message;
  $("loginMessage").className="message "+type;
}

async function login(){
  const btn=$("loginBtn");
  const email=$("loginEmail").value.trim();
  const password=$("loginPassword").value;

  if(!email || !password){
    showLoginMessage("Enter email and password.");
    return;
  }

  btn.disabled=true;
  showLoginMessage("Signing in...","warn");

  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});

    if(error) throw error;

    await showApp(data.user);
  }catch(error){
    showLoginMessage("Login error: "+(error.message || String(error)));
  }finally{
    btn.disabled=false;
  }
}

async function logout(){
  const {error}=await db.auth.signOut();

  if(error){
    showMessage("Logout error: "+error.message,"err");
    return;
  }

  $("app").classList.add("hidden");
  $("logoutBtn").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  $("userLabel").textContent="";
  showLoginMessage("Logged out successfully.","ok");
}

async function showApp(user){
  $("loginBox").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("logoutBtn").classList.remove("hidden");
  $("userLabel").textContent=user.email || "Staff";
  await loadCandidates();
}

async function checkSession(){
  try{
    const {data,error}=await db.auth.getSession();
    if(error) throw error;
    if(data.session) await showApp(data.session.user);
  }catch(error){
    showLoginMessage("Session error: "+error.message);
  }
}

async function loadCandidates(){
  $("candidateRows").innerHTML="<tr><td colspan='7'>Loading candidates...</td></tr>";

  try{
   const {data,error}=await db.from("candidates")
  .select("*")
  .order("created_at",{ascending:false})
  .limit(5);

    if(error) throw error;

    candidates=data || [];
    renderCandidates();
    hideMessage();
  }catch(error){
    $("candidateRows").innerHTML="<tr><td colspan='7'>Could not load records.</td></tr>";
    showMessage("CANDIDATE LOAD ERROR:\n"+error.message,"err");
  }
}

function renderCandidates(){
  const q=$("searchBox").value.toLowerCase().trim();

  const filtered=candidates.filter(c=>
    [c.candidate_id,c.name,c.mobile,c.passport_number,c.position,c.country,c.status]
    .some(v=>String(v||"").toLowerCase().includes(q))
  );

  if(!filtered.length){
    $("candidateRows").innerHTML="<tr><td colspan='7'>No candidates found.</td></tr>";
    return;
  }

  $("candidateRows").innerHTML=filtered.map(c=>`
    <tr>
      <td>${escapeHTML(c.candidate_id)}</td>
      <td>${escapeHTML(c.name)}</td>
      <td>${escapeHTML(c.mobile)}</td>
      <td>${escapeHTML(c.position)}</td>
      <td>${escapeHTML(c.country)}</td>
      <td>${escapeHTML(c.status)}</td>
      <td>
        <button class="light" onclick="editCandidate('${escapeHTML(c.candidate_id)}')">Edit</button>
        <button onclick="openDocuments('${escapeHTML(c.candidate_id)}')">Docs</button>
        <button class="danger" onclick="deleteCandidate('${escapeHTML(c.candidate_id)}')">Delete</button>
      </td>
    </tr>
  `).join("");
}

function newCandidate(){
  $("candidateForm").reset();
  $("candidate_id").value="";
  $("formHeading").textContent="Add Candidate";
  $("candidateFormCard").classList.remove("hidden");
  $("candidateFormCard").scrollIntoView({behavior:"smooth"});
}

function closeCandidateForm(){
  $("candidateFormCard").classList.add("hidden");
}

function editCandidate(id){
  const c=candidates.find(x=>String(x.candidate_id)===String(id));
  if(!c)return;

  $("candidate_id").value=c.candidate_id ?? "";

  [
    "name","mobile","email","passport_number","passport_expiry","dob",
    "country","position","indian_experience","overseas_experience",
    "staff","location","status","registration_type","remarks"
  ].forEach(k=>$(k).value=c[k] ?? "");

  $("formHeading").textContent="Edit Candidate";
  $("candidateFormCard").classList.remove("hidden");
  $("candidateFormCard").scrollIntoView({behavior:"smooth"});
}

async function saveCandidate(event){
  event.preventDefault();

  const btn=$("saveCandidateBtn");
  btn.disabled=true;

  const id=$("candidate_id").value;

  const payload={
    name:$("name").value.trim(),
    mobile:$("mobile").value.trim() || null,
    email:$("email").value.trim() || null,
    passport_number:$("passport_number").value.trim() || null,
    passport_expiry:$("passport_expiry").value || null,
    dob:$("dob").value || null,
    country:$("country").value.trim() || null,
    position:$("position").value.trim() || null,
    indian_experience:$("indian_experience").value.trim() || null,
    overseas_experience:$("overseas_experience").value.trim() || null,
    staff:$("staff").value.trim() || null,
    location:$("location").value.trim() || null,
    status:$("status").value,
    registration_type:$("registration_type").value.trim() || null,
    remarks:$("remarks").value.trim() || null
  };

  try{
    let result;

    if(id){
      result=await db.from("candidates").update(payload).eq("candidate_id",id);
    }else{
      payload.candidate_id="AIHRC-"+Date.now();
      result=await db.from("candidates").insert(payload);
    }

    if(result.error) throw result.error;

    closeCandidateForm();
    showMessage(id?"Candidate updated.":"Candidate added.");
    await loadCandidates();
  }catch(error){
    showMessage("SAVE ERROR:\n"+error.message,"err");
  }finally{
    btn.disabled=false;
  }
}

async function deleteCandidate(id){
  if(!confirm("Delete this candidate?"))return;

  try{
    const {error}=await db.from("candidates").delete().eq("candidate_id",id);
    if(error) throw error;

    showMessage("Candidate deleted.");
    await loadCandidates();
  }catch(error){
    showMessage("DELETE ERROR:\n"+error.message,"err");
  }
}

async function openDocuments(id){
  selectedCandidate=candidates.find(x=>String(x.candidate_id)===String(id));
  if(!selectedCandidate)return;

  $("selectedCandidateId").value=id;
  $("selectedCandidateLabel").textContent=
    "Candidate: "+selectedCandidate.name+" | ID: "+id;

  $("documentsCard").classList.remove("hidden");
  $("documentsCard").scrollIntoView({behavior:"smooth"});
  await loadDocuments();
}

function closeDocuments(){
  $("documentsCard").classList.add("hidden");
  $("documentFile").value="";
}

async function loadDocuments(){
  const id=$("selectedCandidateId").value;
  $("documentList").textContent="Loading...";

  try{
    const {data,error}=await db.from("candidate_documents")
      .select("*").eq("candidate_id",id).order("uploaded_at",{ascending:false});

    if(error) throw error;

    if(!data || data.length===0){
      $("documentList").textContent="No documents uploaded.";
      return;
    }

    $("documentList").innerHTML=data.map(d=>`
      <div class="docrow">
        <div>
          <strong>${escapeHTML(d.file_name)}</strong>
          <div class="small">${escapeHTML(d.uploaded_at)}</div>
        </div>
        <div>
          <button class="light" onclick="downloadDocument('${escapeHTML(d.file_path)}')">Download</button>
          <button class="danger" onclick="deleteDocument(${Number(d.id)},'${escapeHTML(d.file_path)}')">Delete</button>
        </div>
      </div>
    `).join("");
  }catch(error){
    $("documentList").textContent="DOCUMENT LOAD ERROR: "+error.message;
  }
}

async function uploadDocument(){
  const btn=$("uploadBtn");
  const file=$("documentFile").files[0];
  const candidateId=$("selectedCandidateId").value;

  if(!file){
    showMessage("Please choose a document first.","err");
    return;
  }

  if(file.size>50*1024*1024){
    showMessage("Maximum file size is 50 MB.","err");
    return;
  }

  btn.disabled=true;
  btn.textContent="Uploading...";

  let uploadedPath=null;

  try{
    const {data:userData,error:userError}=await db.auth.getUser();

    if(userError) throw userError;
    if(!userData.user) throw new Error("Login session expired. Login again.");

    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=candidateId+"/"+Date.now()+"_"+safeName;

    showMessage("Uploading document...","warn");

    const {error:uploadError}=await db.storage.from(BUCKET)
      .upload(path,file,{cacheControl:"3600",upsert:false});

    if(uploadError) throw uploadError;
    uploadedPath=path;

    const {error:recordError}=await db.from("candidate_documents").insert({
      candidate_id:candidateId,
      file_name:file.name,
      file_path:path,
      uploaded_by:userData.user.id
    });

    if(recordError) throw recordError;

    $("documentFile").value="";
    await loadDocuments();

    showMessage("Document uploaded. Sending email notification...","warn");

    const {data:emailData,error:emailError}=await db.functions.invoke(
      "notify-document-upload",
      {
        body:{
          candidateName:selectedCandidate?.name || "Candidate",
          candidateId:candidateId,
          fileName:file.name
        }
      }
    );

    if(emailError){
      showMessage("Document uploaded, but email notification failed: "+emailError.message,"warn");
    }else if(emailData?.success){
      showMessage("Document uploaded successfully. Email notification accepted by Resend.");
    }else{
      showMessage("Document uploaded, but email response: "+JSON.stringify(emailData),"warn");
    }

  }catch(error){
    if(uploadedPath){
      await db.storage.from(BUCKET).remove([uploadedPath]);
    }
    showMessage("UPLOAD ERROR:\n"+(error.message || String(error)),"err");
  }finally{
    btn.disabled=false;
    btn.textContent="Upload Document";
  }
}

async function downloadDocument(path){
  try{
    const {data,error}=await db.storage.from(BUCKET).download(path);
    if(error) throw error;

    const url=URL.createObjectURL(data);
    const a=document.createElement("a");
    a.href=url;
    a.download=path.split("/").pop() || "document";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(error){
    showMessage("DOWNLOAD ERROR:\n"+error.message,"err");
  }
}

async function deleteDocument(id,path){
  if(!confirm("Delete this document?"))return;

  try{
    const {error:storageError}=await db.storage.from(BUCKET).remove([path]);
    if(storageError) throw storageError;

    const {error:recordError}=await db.from("candidate_documents")
      .delete().eq("id",id);
    if(recordError) throw recordError;

    showMessage("Document deleted.");
    await loadDocuments();
  }catch(error){
    showMessage("DOCUMENT DELETE ERROR:\n"+error.message,"err");
  }
}

checkSession();
</script>
</body>
</html>
