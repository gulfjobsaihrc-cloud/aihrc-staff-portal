
<script>
const URL = 'https://nffnrdvzjkxvokmitlev.supabase.co';
const KEY = 'sb_publishable_AoHpTGGE7e1Wkd4iYGaYHg_C1is5lYI';
const db = supabase.createClient(URL, KEY);

let list = [], selected = null;
const $ = id => document.getElementById(id);
const fields = [
'name','mobile','mail','passport_number','passport_expiry','dob',
'country','position','indian_experience','overseas_experience',
'staff','status','registration_type','location','remarks'
];

function message(t) {
  $('msg').textContent = t;
  $('msg').classList.remove('hide');
}
function escapeHTML(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])
  );
}
function app(session) {
  $('login').classList.toggle('hide', !!session);
  $('portal').classList.toggle('hide', !session);
  if (session) load();
}

async function load() {
  const {data,error} = await db.from('candidates')
    .select('*').order('created_at',{ascending:false});
  if (error) return message(error.message);
  list = data || [];
  draw();
}

function draw() {
  const q = $('search').value.toLowerCase();
  $('rows').innerHTML = list.filter(c =>
    [c.name,c.mobile,c.passport_number,c.position]
      .some(v => String(v || '').toLowerCase().includes(q))
  ).map(c => `<tr>
    <td>${escapeHTML(c.candidate_id)}</td>
    <td>${escapeHTML(c.name)}</td>
    <td>${escapeHTML(c.position)}</td>
    <td>${escapeHTML(c.passport_number)}</td>
    <td>${escapeHTML(c.dob)}</td>
    <td>${escapeHTML(c.overseas_experience)}</td>
    <td>${escapeHTML(c.indian_experience)}</td>
    <td>${escapeHTML(c.mobile)}</td>
    <td>${escapeHTML(c.status)}</td>
    <td>
      <button onclick="editCandidate('${escapeHTML(c.candidate_id)}')">Edit</button>
      <button onclick="openDocs('${escapeHTML(c.candidate_id)}')">Docs</button>
      <button onclick="deleteCandidate('${escapeHTML(c.candidate_id)}')">Delete</button>
    </td></tr>`).join('');
}

function showForm(c) {
  $('form').classList.remove('hide');
  $('cid').value = c?.candidate_id || '';
  fields.forEach(f => {
    $(f).value = c?.[f === 'mail' ? 'email' : f] || '';
  });
}
window.editCandidate = id => showForm(list.find(c => c.candidate_id === id));

window.deleteCandidate = async id => {
  if (!confirm('Delete this candidate?')) return;
  const {error} = await db.from('candidates').delete().eq('candidate_id',id);
  if (error) message(error.message);
  else { message('Candidate deleted'); await load(); }
};

window.openDocs = async id => {
  selected = list.find(c => c.candidate_id === id);
  $('docs').classList.remove('hide');
  $('docname').textContent = selected.name + ' / ' + id;
  await refreshDocs();
};

async function refreshDocs() {
  const {data,error} = await db.from('candidate_documents')
    .select('*').eq('candidate_id',selected.candidate_id);
  if (error) return message(error.message);
  $('docrows').innerHTML = (data || []).map(d => `
    <p>${escapeHTML(d.file_name)}
    <button onclick="downloadDoc('${escapeHTML(d.file_path)}')">Download</button>
    <button onclick="deleteDoc(${d.id},'${escapeHTML(d.file_path)}')">Delete</button></p>
  `).join('');
}

window.downloadDoc = async path => {
  const {data,error} = await db.storage
    .from('aihrc-candidate-documents').createSignedUrl(path,300);
  if (error) return message(error.message);
  window.open(data.signedUrl,'_blank');
};

window.deleteDoc = async (id,path) => {
  if (!confirm('Delete document?')) return;
  const {error:storageError} = await db.storage
    .from('aihrc-candidate-documents').remove([path]);
  if (storageError) return message(storageError.message);
  const {error} = await db.from('candidate_documents').delete().eq('id',id);
  if (error) return message(error.message);
  await refreshDocs();
};

$('loginBtn').onclick = async () => {
  const {data,error} = await db.auth.signInWithPassword({
    email:$('email').value.trim(),
    password:$('password').value
  });
  if (error) message(error.message);
  else app(data.session);
};

$('logout').onclick = async () => {
  await db.auth.signOut();
  app(null);
};

$('add').onclick = () => showForm(null);
$('cancel').onclick = () => $('form').classList.add('hide');
$('search').oninput = draw;
$('closeDocs').onclick = () => $('docs').classList.add('hide');

$('save').onclick = async () => {
  const o = {};
  fields.forEach(f => o[f === 'mail' ? 'email' : f] = $(f).value.trim() || null);
  if (!o.name) return message('Enter candidate name');

  const id = $('cid').value;
  const result = id
    ? await db.from('candidates').update(o).eq('candidate_id',id)
    : await db.from('candidates').insert({
        ...o, candidate_id:'AIHRC-' + Date.now()
      });

  if (result.error) return message(result.error.message);
  $('form').classList.add('hide');
  message(id ? 'Candidate updated' : 'Candidate added');
  await load();
};

$('upload').onclick = async () => {
  const f = $('file').files[0];
  if (!f || !selected) return message('Choose a document');

  const path = selected.candidate_id + '/' + Date.now() + '_' +
    f.name.replace(/[^a-zA-Z0-9._-]/g,'_');

  const {error:uploadError} = await db.storage
    .from('aihrc-candidate-documents').upload(path,f);
  if (uploadError) return message(uploadError.message);

  const {data:userData} = await db.auth.getUser();
  const {error} = await db.from('candidate_documents').insert({
    candidate_id:selected.candidate_id,
    file_name:f.name,
    file_path:path,
    uploaded_by:userData.user.id
  });

  if (error) return message(error.message);
  $('file').value = '';
  message('Document uploaded successfully');
  await refreshDocs();
};

db.auth.getSession().then(({data,error}) => {
  if (error) message(error.message);
  app(data.session);
});
</script>
